              <span class="product-card__price-label">Цена:</span>
              <span class="product-card__price-value"></span>
            </div>
          </div>
        </template>

    </main>
    <footer class="footer">
      <div class="footer__inner">
        <div class="footer__columns">
          <div class="footer__column">
            <div class="brand">
              <p class="brand__name">Product Cards</p>
              <p class="brand__tagline">
                У нас самые лучшие продукты для кожи!
              </p>
            </div>
            <div class="social">
              <ul class="social__list">
                <li class="social__item">
                  <a class="social__link" href="#">
                    <img
                      src="footer-img/telegram.svg"
                      alt="Telegram"
                      width="21"
                      height="18"
                    />
                  </a>
                </li>
                <li class="social__item">
                  <a class="social__link" href="#">
                    <img
                      src="footer-img/vk.svg"
                      alt="VK"
                      width="24"
                      height="14"
                    />
                  </a>
                </li>
              </ul>
            </div>
          </div>
          <div class="subscribe">
            <p class="subscribe__title">Подпишись на наши акции:</p>
            <form class="subscribe__form" id="email-form" method="post" action="#">
              <label class="visually-hidden" for="subscribe-email"
                >Электронная почта</label
              >
              <input
                class="subscribe__input"
                id="subscribe-email"
                name="email"
                type="email"
                placeholder="Введи Email..."
                required
              />
              <button class="subscribe__button" type="submit">
                Подписаться
              </button>
            </form>
          </div>
          <nav class="quick-links">
            <p class="quick-links__title">Быстрые ссылки</p>
            <ul class="quick-links__list">
              <li class="quick-links__item">
                <a class="quick-links__link" href="#">Главная</a>
              </li>
              <li class="quick-links__item">
                <a class="quick-links__link" href="#">Магазин</a>
              </li>
              <li class="quick-links__item">
                <a class="quick-links__link" href="#">Контакты</a>
              </li>
            </ul>
          </nav>
        </div>
        <div class="footer__bottom">
          <p class="footer__copyright">
            www.product-cards.com © all right reserve
          </p>
        </div>
      </div>
    </footer>
    <div class="overlay" id="js-overlay"></div>
    <div class="modal" id="js-modal">
      <button class="modal__close" id="js-modal-close" type="button" aria-label="Закрыть">×</button>

      <h2 class="modal__title">Регистрация</h2>

      <form id="register-form" class="register-form">
        <div class="register-form__field">
          <label for="firstname">Имя:</label>
          <input type="text" id="firstname" name="firstname" placeholder="Иван" required>
        </div>

        <div class="register-form__field">
          <label for="lastname">Фамилия:</label>
          <input type="text" id="lastname" name="lastname" placeholder="Петров" required>
        </div>

        <div class="register-form__field">
          <label for="birthdate">Дата рождения:</label>
          <input type="date" id="birthdate" name="birthDate" min="1925-01-01" max="2026-09-24" required>
        </div>

        <div class="register-form__field">
          <label for="login">Логин:</label>
          <input type="text" id="login" name="login" placeholder="ivan_petrov" autocomplete="username" minlength="5" required>
        </div>

        <div class="register-form__field">
          <label for="password">Пароль:</label>
          <input type="password" id="password" name="password" placeholder="Минимум 10 символов" autocomplete="new-password" minlength="10" required>
        </div>

        <div class="register-form__field">
          <label for="password-confirm">Подтвердите пароль:</label>
          <input type="password" id="password-confirm" name="passwordConfirm" placeholder="Повторите пароль" autocomplete="new-password" minlength="10" required>
        </div>

        <button class="register-form__submit" type="submit">Зарегистрироваться</button>

      </form>
    </div>
