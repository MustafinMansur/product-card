  <template id="product-card-template">
  <div class="product-card">
    <div class="product-card__image">

    </div>
    <span class="product-card__skin-type"></span>
    <h2 class="product-card__title"></h2>
    <p class="product-card__text"></p>
    <span class="product-card__composition-title">Состав:</span>
    <ul class="product-card__composition-list">
    </ul>
    <div class="product-card__price">
      <span class="product-card__price-label">Цена:</span>
      <span class="product-card__price-value"></span>
    </div>
  </div>
</template>
